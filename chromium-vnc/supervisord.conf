[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:Xvfb]
command=/usr/bin/Xvfb :1 -screen 0 %(ENV_RESOLUTION)s
autorestart=true
priority=10

[program:fluxbox]
command=/usr/bin/fluxbox
environment=DISPLAY=":1"
autorestart=true
priority=20
startsecs=2

[program:x11vnc]
command=/usr/bin/x11vnc -display :1 -nopw -forever -shared -rfbport 5900 -noxdamage
autorestart=true
priority=30
startsecs=3

[program:websockify]
command=/usr/bin/websockify --web /usr/share/novnc 0.0.0.0:6901 localhost:5900
autorestart=true
priority=40
startsecs=4

[program:chromium]
command=/start-chromium.sh
environment=DISPLAY=":1"
autorestart=true
priority=50
startsecs=5
