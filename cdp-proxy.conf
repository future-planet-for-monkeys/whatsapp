# Nginx reverse-proxy for Chrome DevTools Protocol (CDP).
#
# Chrome binds its debugging port to 127.0.0.1 only and enforces two security
# checks on every incoming request:
#
#   1. Host header DNS-rebinding protection — rejects anything != localhost/IP
#   2. Origin header check — rejects untrusted origins
#
# This proxy:
#   • Listens on 0.0.0.0:9223 inside the whatsapp-chromium network namespace
#     (network_mode: service:whatsapp-chromium in compose) so it is reachable
#     from other containers as whatsapp-neo2-chromium:9223
#   • Rewrites Host → localhost          (passes DNS-rebinding check)
#   • Rewrites Origin → http://localhost (passes origin check)
#   • Handles WebSocket upgrade          (required by CDP / puppeteer)

server {
    listen 9223;

    location / {
        proxy_pass         http://127.0.0.1:9222;

        # Bypass Chrome's DNS-rebinding & origin security checks
        proxy_set_header   Host              localhost;
        proxy_set_header   Origin            http://localhost;

        # WebSocket / CDP protocol support
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "Upgrade";
        proxy_set_header   X-Real-IP         $remote_addr;

        # Long-lived connections (CDP sessions stay open for the whole session)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        proxy_buffering    off;
    }
}
