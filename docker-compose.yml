services:
  whatsapp-chromium:
    build:
      context: ./chromium-vnc
    image: whatsapp-chromium-vnc2:local
    container_name: ${INSTANCE_NAME:-whatsapp-neo}-chromium
    restart: unless-stopped
    shm_size: "1gb"
    # Port 3008 → noVNC HTTP (plain, no HTTPS required)
    # Port 9223 → Chrome DevTools Protocol (CDP) WebSocket proxy
    ports:
      - "${NOVNC_PORT:-3008}:6901"
      - "${CDP_PORT:-9223}:9223"
    volumes:
      # Persist Chromium browser profile so WhatsApp session survives container restarts
      - chromium_profile:/chromium-profile
    networks:
      - whatsapp-internal
      - proxy

  # Nginx reverse-proxy for Chrome DevTools Protocol.
  # Runs in the same network namespace as whatsapp-chromium (so 127.0.0.1
  # resolves to Chrome's loopback interface) and listens on 0.0.0.0:9223,
  # rewriting Host → localhost to bypass Chrome's DNS-rebinding protection.
  cdp-proxy:
    image: nginx:alpine
    container_name: ${INSTANCE_NAME:-whatsapp-neo}-cdp-proxy
    restart: unless-stopped
    network_mode: "service:whatsapp-chromium"
    volumes:
      - ./cdp-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - whatsapp-chromium

  whatsapp-api:
    build:
      context: ./whatsapp-api
    image: whatsapp-neo-api:local
    container_name: ${INSTANCE_NAME:-whatsapp-neo}-api
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=development
    ports:
      - "${API_PORT:-3022}:3000"
    volumes:
      # Source files from host — changes trigger auto-reload via nodemon
      - ./whatsapp-api/src:/app/src
      # Session persistence — survives container restarts
      - session:/app/.wwebjs_auth
      # node_modules live inside the image layer, NOT on the host
    depends_on:
      - whatsapp-chromium
      - cdp-proxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - whatsapp-internal
      - proxy

volumes:
  session:
    name: ${INSTANCE_NAME:-whatsapp-neo}_session
  chromium_profile:
    name: ${INSTANCE_NAME:-whatsapp-neo}_chromium_profile

networks:
  whatsapp-internal:
    name: ${INSTANCE_NAME:-whatsapp-neo}-internal
    driver: bridge
  proxy:
    external: true
