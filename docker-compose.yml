services:
  # ── Chromium + VNC ──────────────────────────────────────────────────────────
  # Runs Chromium with a virtual X11 display (Xvfb + fluxbox) + noVNC for
  # browser-based access. Chrome DevTools Protocol listens on 127.0.0.1:9222
  # inside the container — the cdp-proxy sidecar makes it network-accessible.
  whatsapp-chromium:
    build:
      context: ./chromium-vnc
    image: whatsapp-chromium-vnc:local
    container_name: ${INSTANCE_NAME:-whatsapp-neo}-chromium
    restart: unless-stopped
    shm_size: "1gb"
    ports:
      # noVNC web client — open http://localhost:${NOVNC_PORT:-3008} to see the
      # Chromium desktop and scan the WhatsApp Web QR code when pairing.
      - "${NOVNC_PORT:-3008}:6901"
      # CDP proxy — exposed for the "local" profile (API on host, browser in
      # Docker). Set CDP_PORT in .env to change, or comment out to disable.
      - "${CDP_PORT:-9223}:9223"
    volumes:
      # Persist Chromium browser profile so WhatsApp session survives restarts.
      - chromium_profile:/chromium-profile
    healthcheck:
      # Chrome's own CDP endpoint (loopback, pre-proxy) — proves the browser
      # process itself is up before anything tries to talk to it.
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9222/json/version"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - whatsapp-internal

  # ── CDP reverse proxy ──────────────────────────────────────────────────────
  # Sidecar that shares whatsapp-chromium's network namespace. Listens on
  # 0.0.0.0:9223 (reachable from other containers as whatsapp-chromium:9223)
  # and rewrites Host → localhost to bypass Chrome's DNS-rebinding protection.
  cdp-proxy:
    image: nginx:alpine
    container_name: ${INSTANCE_NAME:-whatsapp-neo}-cdp-proxy
    restart: unless-stopped
    network_mode: "service:whatsapp-chromium"
    volumes:
      - ./cdp-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      whatsapp-chromium:
        condition: service_healthy
    healthcheck:
      # End-to-end check through the proxy — confirms Host/Origin rewriting
      # works and Chrome answers through it.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9223/json/version"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # ── WhatsApp REST API ──────────────────────────────────────────────────────
  # Node.js/Express server that wraps whatsapp-web.js. Connects to Chromium
  # via CDP (ws://whatsapp-chromium:9223). Exposes a REST API for the PWA.
  whatsapp-api:
    build:
      context: ./whatsapp-api
    image: whatsapp-neo-api:local
    container_name: ${INSTANCE_NAME:-whatsapp-neo}-api
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=development
    ports:
      - "${API_PORT:-3022}:3000"
    volumes:
      # Source files from host — changes trigger auto-reload via nodemon
      - ./whatsapp-api/src:/app/src
      # Session persistence — survives container restarts
      - session:/app/.wwebjs_auth
      # node_modules live inside the image layer, NOT on the host
    depends_on:
      whatsapp-chromium:
        condition: service_healthy
      cdp-proxy:
        condition: service_healthy
    healthcheck:
      # node:20-slim has neither curl nor wget — use Node's own http client.
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - whatsapp-internal

  # ── PWA front-end ──────────────────────────────────────────────────────────
  # React/Vite static build served by nginx. Proxies every /single/* request
  # to whatsapp-api:3000 on the internal network — browser only talks to one
  # origin, so no CORS needed.
  whatsapp-pwa:
    build:
      context: ./whatsapp-pwa
    image: whatsapp-neo-pwa:local
    container_name: ${INSTANCE_NAME:-whatsapp-neo}-pwa
    restart: unless-stopped
    ports:
      - "${PWA_PORT:-3009}:80"
    depends_on:
      whatsapp-api:
        condition: service_healthy
    networks:
      - whatsapp-internal

volumes:
  session:
    name: ${INSTANCE_NAME:-whatsapp-neo}_session
  chromium_profile:
    name: ${INSTANCE_NAME:-whatsapp-neo}_chromium_profile

networks:
  whatsapp-internal:
    name: ${INSTANCE_NAME:-whatsapp-neo}-internal
    driver: bridge
