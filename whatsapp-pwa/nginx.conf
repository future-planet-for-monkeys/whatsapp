# Nginx config for the WhatsApp PWA static bundle.
#
# Serves the compiled Vite/React build and reverse-proxies every "/single"
# API call to the whatsapp-api service on the shared Docker network. This
# keeps the browser on a single origin — no CORS headers needed, and the
# Basic Auth credentials set by the frontend's Axios interceptor pass
# straight through untouched.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── API proxy ────────────────────────────────────────────────────────────
    # "whatsapp-api" resolves via Docker's internal DNS to the API container
    # (the compose service name), regardless of INSTANCE_NAME/container_name.
    location /single/ {
        proxy_pass http://whatsapp-api:3000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── Service worker / manifest ────────────────────────────────────────────
    # Must always be revalidated so PWA updates roll out promptly.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # ── Hashed static assets ─────────────────────────────────────────────────
    # Vite fingerprints these filenames, so they're safe to cache forever.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── SPA fallback ─────────────────────────────────────────────────────────
    # React Router owns all remaining routes — always resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
